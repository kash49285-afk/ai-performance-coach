<html>
<head>
<title>AI Performance Coach</title>
let sessionStartTime = Date.now();
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg, #0f172a, #1e3a8a, #0f172a, #312e81);
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
  color: white;
  overflow: hidden;
}

@keyframes gradientMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.centerScreen {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: 0.5s;
}

h1 {
  font-size: 3em;
  margin-bottom: 10px;
}

button {
  padding: 15px 30px;
  font-size: 18px;
  margin: 10px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  background: rgba(37,99,235,0.6);
  box-shadow: 0 0 20px #3b82f6;
}

#trainingScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  background: black;
}

video, canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#aiPanel {
  position: absolute;
  right: 20px;
  top: 20px;
  width: 300px;
  padding: 20px;
  background: rgba(0,0,0,0.6);
  border-radius: 15px;
  backdrop-filter: blur(10px);
}

.fadeOut {
  opacity: 0;
  pointer-events: none;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

</head>

<body>

<div id="menuScreen" class="centerScreen">

<h1>AI Performance Coach</h1>

<div id="step1">
<h2>Select training form</h2>

<button onclick="selectForm('K-pop')">K-pop</button>
<button onclick="selectForm('Hip-hop')">Hip-hop</button>
<button onclick="selectForm('Bharatanatyam')">Bharatanatyam</button>
<button onclick="selectForm('Vocals')">Vocals</button>

</div>

<div id="step2" style="display:none;">

<h2>Select your goal</h2>

<button onclick="selectGoal('Beginner')">Beginner</button>
<button onclick="selectGoal('Technique')">Technique</button>
<button onclick="selectGoal('Audition')">Audition</button>

</div>

<div id="step3" style="display:none;">

<h2>Ready</h2>

<button onclick="enterTraining()">ENTER TRAINING</button>

</div>

</div>


<div id="trainingScreen">

<video id="video" autoplay muted></video>
<canvas id="canvas"></canvas>

<div id="aiPanel">

<h3>AI Coach</h3>

<div id="status">
Observing movement...
</div>

</div>

</div>


<script>

let selectedForm = "";
let selectedGoal = "";

function selectForm(form) {

selectedForm = form;

document.getElementById("step1").style.display = "none";
document.getElementById("step2").style.display = "block";

}

function selectGoal(goal) {

selectedGoal = goal;

document.getElementById("step2").style.display = "none";
document.getElementById("step3").style.display = "block";

}

function enterTraining(){

localStorage.setItem("form", selectedForm);
localStorage.setItem("goal", selectedGoal);

document.getElementById("menuScreen").classList.add("fadeOut");

setTimeout(() => {

document.getElementById("menuScreen").style.display = "none";
document.getElementById("trainingScreen").style.display = "block";

startCamera();
startPose();

},500);

}


function startCamera(){

navigator.mediaDevices.getUserMedia({video:true})

.then(stream => {

video.srcObject = stream;

})

.catch(() => {

alert("Camera access required");

});

}



function startPose(){

const canvasElement = document.getElementById('canvas');
const canvasCtx = canvasElement.getContext('2d');

const pose = new Pose({

locateFile: file =>
`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`

});

pose.setOptions({

modelComplexity:1,
smoothLandmarks:true,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5

});


pose.onResults(results => {
let sessionLength = Math.floor((Date.now() - sessionStartTime)/1000);

localStorage.setItem("lastSessionLength", sessionLength);
canvasElement.width = video.videoWidth;
canvasElement.height = video.videoHeight;

canvasCtx.clearRect(0,0,canvasElement.width,canvasElement.height);

canvasCtx.drawImage(results.image,0,0,
canvasElement.width,canvasElement.height);
if (results.poseLandmarks) {

  drawConnectors(
    canvasCtx,
    results.poseLandmarks,
    POSE_CONNECTIONS,
    {color: '#00FFCC', lineWidth: 4}
  );

  drawLandmarks(
    canvasCtx,
    results.poseLandmarks,
    {color: '#FF0000', lineWidth: 2}
  );
let leftShoulder = results.poseLandmarks[11];
let rightShoulder = results.poseLandmarks[12];

let shoulderTilt = Math.abs(leftShoulder.y - rightShoulder.y);

if (shoulderTilt > 0.05) {

  document.getElementById("status").innerHTML =
  "Try keeping your shoulders level.";

} else {

  document.getElementById("status").innerHTML =
  "Good posture. Keep training.";

}
}

// Detect movement level

if(results.poseLandmarks){

let leftWrist = results.poseLandmarks[15];
let rightWrist = results.poseLandmarks[16];

let movementScore =
Math.abs(leftWrist.x - rightWrist.x) +
Math.abs(leftWrist.y - rightWrist.y);

if(movementScore > 0.2){

document.getElementById("status").innerHTML =
"Good, you're moving. Keep going.";

}else{

document.getElementById("status").innerHTML =
"Move more so I can analyze your technique.";

}

}
