<!DOCTYPE html>
<html>
<head>
<title>AI Performance Coach</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#020617);
color:white;
overflow:hidden;
}

.center{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

h1{
font-size:48px;
margin-bottom:10px;
}

button{
padding:14px 28px;
margin:10px;
font-size:16px;
border-radius:10px;
border:none;
background:#3b82f6;
color:white;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.08);
background:#2563eb;
}

input,textarea{
padding:10px;
margin:6px;
border-radius:8px;
border:none;
width:260px;
}

#training{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
background:black;
}

video,canvas{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

#menu{
position:absolute;
left:0;
top:0;
width:260px;
height:100%;
background:rgba(0,0,0,0.6);
padding:20px;
backdrop-filter:blur(10px);
}

#chat{
position:absolute;
right:0;
top:0;
width:300px;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
flex-direction:column;
}

#chatMessages{
flex:1;
overflow:auto;
padding:10px;
}

#chatInput{
display:flex;
}

#chatInput input{
flex:1;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

</head>

<body>

<div id="start" class="center">

<h1>AI Performance Coach</h1>

<input id="name" placeholder="Your name">
<input id="age" placeholder="Age">

<textarea id="goal"
placeholder="Describe your goal (ex: become a K-pop trainee main dancer)"></textarea>

<button onclick="startApp()">ENTER TRAINING</button>

</div>


<div id="training">

<video id="video" autoplay muted></video>
<canvas id="canvas"></canvas>

<div id="menu">

<h3>Training Menu</h3>

<button onclick="toggleSkeleton()">Skeleton Overlay</button>

<br><br>

<label>Upload Music</label>
<input type="file" id="music" accept="audio/*">

<br><br>

<button onclick="playMusic()">Play Music</button>

</div>


<div id="chat">

<div id="chatMessages">
AI Coach: Start moving so I can analyze your training.
</div>

<div id="chatInput">

<input id="userMessage" placeholder="Ask coach...">

<button onclick="sendMessage()">Send</button>

</div>

</div>

</div>


<script>

let showSkeleton=false
let audio=new Audio()

function startApp(){

let name=document.getElementById("name").value
let age=document.getElementById("age").value
let goal=document.getElementById("goal").value

localStorage.setItem("name",name)
localStorage.setItem("age",age)
localStorage.setItem("goal",goal)

document.getElementById("start").style.display="none"
document.getElementById("training").style.display="block"

startCamera()
startPose()

}


function toggleSkeleton(){
showSkeleton=!showSkeleton
}

function playMusic(){

let file=document.getElementById("music").files[0]

if(file){
audio.src=URL.createObjectURL(file)
audio.play()
}

}


function sendMessage(){

let msg=document.getElementById("userMessage").value

let chat=document.getElementById("chatMessages")

chat.innerHTML+="<br>You: "+msg

chat.innerHTML+="<br>AI Coach: Good question. Keep training and focus on control."

document.getElementById("userMessage").value=""

}


function startCamera(){

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject=stream
})

}


function startPose(){

const canvasElement=document.getElementById("canvas")
const canvasCtx=canvasElement.getContext("2d")

const pose=new Pose({
locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
})

pose.setOptions({
modelComplexity:1,
smoothLandmarks:true,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5
})

pose.onResults(results=>{

canvasElement.width=video.videoWidth
canvasElement.height=video.videoHeight

canvasCtx.clearRect(0,0,canvasElement.width,canvasElement.height)

canvasCtx.drawImage(results.image,0,0,canvasElement.width,canvasElement.height)

if(results.poseLandmarks){

if(showSkeleton){

drawConnectors(canvasCtx,results.poseLandmarks,POSE_CONNECTIONS,
{color:"#00FFFF",lineWidth:4})

drawLandmarks(canvasCtx,results.poseLandmarks,
{color:"#FF2D55",lineWidth:2})

}

let leftShoulder=results.poseLandmarks[11]
let rightShoulder=results.poseLandmarks[12]

let tilt=Math.abs(leftShoulder.y-rightShoulder.y)

if(tilt>0.05){

document.getElementById("chatMessages").innerHTML=
"AI Coach: Keep your shoulders level."

}

}

})

const camera=new Camera(video,{
onFrame:async()=>{await pose.send({image:video})},
width:1280,
height:720
})

camera.start()

}

</script>

</body>
</html>
